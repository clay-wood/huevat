[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huevat"
version = "0.1.0"
description = "Screened scientific palettes, gradients and coordinated figure styles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = []

[project.optional-dependencies]
design = ["numpy>=1.24", "scipy>=1.10", "colorspacious==1.1.2"]
research = ["numpy>=1.24", "matplotlib>=3.8", "colorspacious==1.1.2", "colorcet==3.2.1"]
matplotlib = ["matplotlib>=3.9"]
plotly = ["plotly>=6,<8"]
ultraplot = ["ultraplot>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8", "build>=1", "pip>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["research: optional reference study and independent-space audit"]

[tool.setuptools.package-data]
huevat = ["data/*.json"]
