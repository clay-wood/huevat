[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huevat"
version = "0.1.0.dev0"
description = "Numerical foundations for constrained scientific color design"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = []

[project.optional-dependencies]
design = ["numpy>=1.24", "scipy>=1.10"]

[dependency-groups]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
