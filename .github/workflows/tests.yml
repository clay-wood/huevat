name: Numerical foundation and reference study
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} pytest
      - run: uv run --locked --python ${{ matrix.python }} python tools/check_provenance.py
      - run: uv build --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} python tools/check_install.py

  research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra research --extra design --python 3.12
      - run: uv run --locked --extra research --extra design --python 3.12 pytest
      - run: uv run --locked --extra research --extra design --python 3.12 python tools/freeze_references.py --check
      - run: uv run --locked --extra research --extra design --python 3.12 python tools/build_baseline.py --check
      - run: uv run --locked --extra research --extra design --python 3.12 python tools/build_ordered.py --check
      - run: uv run --locked --extra research --extra design --python 3.12 python tools/build_families.py --check
